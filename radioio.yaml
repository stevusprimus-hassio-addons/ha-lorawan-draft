# --------------------------------------------------------------------------- #
# LoRaWAN / ChirpStack identifiers — single source of truth.
# Referenced below as ${app_id}, ${dev_eui}, ${join_eui}, ${app_key},
# --------------------------------------------------------------------------- #
substitutions:
  app_id:   !secret app_id
  dev_eui:  !secret dev_eui
  join_eui: !secret join_eui
  app_key:  !secret app_key
  name: "lolin32-lorawan-01"
  friendly_name: "lolin32-lorawan-01"
  
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - triple_rst.h      # RTC-RAM RST-press counter for triple-RST AP mode
  on_boot:
    # Run after all components are set up.  Checks for triple-RST press first;
    # if detected, enters WiFi AP maintenance mode and skips everything else.
    # Otherwise runs the normal boot sequence.
    priority: -100
    then:
      # triple_rst_check() counts ESP_RST_EXT (physical RST button) resets in
      # RTC RAM.  Any other reset type (power-on, deep-sleep, watchdog) resets
      # the counter, so normal cycling never accumulates.
      - lambda: |-
          if (triple_rst_check()) {
            id(triple_rst_active) = true;
          }

      - if:
          condition:
            lambda: 'return id(triple_rst_active);'
          then:
            # ---------------------------------------------------------------- #
            # Triple-RST AP maintenance mode
            # Join WiFi SSID "<device-name>-ap", password "radioio12".
            # Open http://192.168.4.1 for the ESPHome web UI / OTA.
            # Press RST once to leave AP mode and return to normal operation.
            # ---------------------------------------------------------------- #
            - logger.log:
                level: WARN
                format: "*** AP MODE *** Triple RST detected"
            - logger.log:
                level: WARN
                format: "  SSID     : %s-ap"
                args: [App.get_name().c_str()]
            - logger.log:
                level: WARN
                format: "  Password : radioio12"
            - logger.log:
                level: WARN
                format: "  URL      : http://192.168.4.1"
            # Start soft-AP via ESP-IDF (compatible with ESPHome's IDF WiFi component).
            # Switches WiFi to APSTA mode and configures the AP interface;
            # ESPHome's STA management continues alongside it.
            - lambda: |-
                start_maintenance_ap((App.get_name() + "-ap").c_str(), "radioio12");
            - deep_sleep.prevent: ds

          else:
            # ---------------------------------------------------------------- #
            # Normal boot sequence
            # ---------------------------------------------------------------- #

            # Mark setup complete — guards in turn_on/off actions check this
            # before calling mqtt_client.enable() to avoid crashing during setup().
            - lambda: 'id(setup_done) = true;'
            - lambda: |-
                ESP_LOGI("on_boot", "start — wifi_enabled=%s  deep_sleep_enabled=%s",
                         id(wifi_enabled).state ? "ON" : "OFF",
                         id(deep_sleep_enabled).state ? "ON" : "OFF");
            - if:
                condition:
                  switch.is_off: deep_sleep_enabled
                then:
                  - deep_sleep.prevent: ds

            # Try to publish HA MQTT discovery on EVERY boot, regardless of
            # wifi_enabled — discovery is retained on the broker and idempotent.
            # We wait briefly for MQTT to come up; if it doesn't, we skip and the
            # already-retained discovery on the broker keeps HA happy.
            - logger.log: "on_boot: waiting up to 15s for MQTT to publish discovery"
            - wait_until:
                condition:
                  mqtt.connected:
                timeout: 15s
            - if:
                condition:
                  mqtt.connected:
                then:
                  - logger.log: "on_boot: MQTT connected — publishing discovery"
                  - lorawan.publish_discovery:
                  - delay: 1s         # let publishes flush before we maybe disable WiFi
                else:
                  - logger.log: "on_boot: MQTT timed out — discovery skipped this cycle"

            # NOW honour wifi_enabled for the rest of this wake cycle.
            # Stop MQTT before tearing down WiFi so ESP-IDF doesn't log socket-abort
            # errors for the few seconds between WiFi-down and MQTT noticing.
            - if:
                condition:
                  switch.is_off: wifi_enabled
                then:
                  - logger.log: "on_boot: wifi_enabled=OFF → entering battery mode"
                  - lambda: 'id(mqtt_client).disable();'
                  - wifi.disable:

            # Apply the restored/initial sleep duration to the deep_sleep component.
            # set_action does not fire on initial_value or NVS restore, so we push
            # the current number state manually on every boot.
            - lambda: 'id(ds).set_sleep_duration((uint32_t) id(sleep_duration_s).state * 1000UL);'

            # Wait for sensors to produce their first reading, then uplink.
            - delay: 10s
            - lorawan.send:

esp32:
  board: lolin32_lite
  framework:
    type: arduino

# Set to true once on_boot fires — i.e. after all setup() calls have
# completed.  Used to guard actions that crash if called too early
# (e.g. mqtt_client.enable() before LwIP is initialised).
globals:
  - id: setup_done
    type: bool
    initial_value: 'false'
    restore_value: false
  # Set by the triple-RST check in on_boot; never persisted across boots.
  - id: triple_rst_active
    type: bool
    initial_value: 'false'
    restore_value: false

# Enable logging
logger:

#Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:

  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

i2c:
  sda: GPIO00
  scl: GPIO04
  scan: true
  id: bus_a

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  # Don't auto-publish HA discovery for the ESP's own entities — they're
  # already exposed via api:.  We only use this mqtt client to publish our
  # explicit button-discovery messages and LoRaWAN downlink commands.
  discovery: false
  # Don't block setup() if the broker is unreachable (e.g. WiFi down).
  reboot_timeout: 0s

sensor:
  - platform: adc
    pin: GPIO35
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12db
    samples: 16
    update_interval: 30s
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    filters:
      # 100k/100k divider halves the battery voltage at the ADC pin.
      - multiply: 2.0
  - platform: adc
    pin: GPIO36
    name: "Rain Sensor Voltage"
    id: rain_sensor_voltage
    attenuation: 12db
    samples: 16
    update_interval: 30s
    unit_of_measurement: V
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
  - platform: template
    name: "Battery"
    id: battery_percentage
    update_interval: 30s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    lambda: |-
      if (isnan(id(battery_voltage).state)) {
        return NAN;
      }
      const float percent = (id(battery_voltage).state - 3.0f) * 100.0f / (4.2f - 3.0f);
      return clamp(percent, 0.0f, 100.0f);
  - platform: template
    name: "Motion State"
    id: motion_state
    internal: true
    update_interval: 1s
    lambda: |-
      return id(motion).state ? 1.0f : 0.0f;
  - platform: template
    name: "Rain State"
    id: rain_state
    internal: true
    update_interval: 1s
    lambda: |-
      return id(rain_detected).state ? 1.0f : 0.0f;
  - platform: aht10
    variant: AHT20
    address: 0x38
    temperature:
      name: "AHT20 Temperature"
      id: aht20_temperature
    humidity:
      name: "AHT20 Humidity"
      id: aht20_humidity
    update_interval: 60s
  - platform: bmp280_i2c
    address: 0x77
    pressure:
      name: "BMP280 Pressure"
      id: bmp280_pressure
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    id: device_uptime
    type: seconds
    name: Uptime Sensor
    update_interval: 10s
  - platform: tcs34725
    red_channel:
      name: "TCS34725 Red Channel"
      id: tcs34725_red_channel
    green_channel:
      name: "TCS34725 Green Channel"
      id: tcs34725_green_Channel
    blue_channel:
      name: "TCS34725 Blue Channel"
      id: tcs34725_blue_channel
    clear_channel:
      name: "TCS34725 Clear Channel"
      id: tcs34725_clear_channel
    illuminance:
      name: "TCS34725 Illuminance"
      id: tcs34725_illuminance
    color_temperature:
      name: "TCS34725 Color Temperature"
      id: tcs34725_color_temperature
    glass_attenuation_factor: 1.0
    address: 0x29
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Charging"
    id: battery_charging
    device_class: battery_charging
    lambda: |-
      if (isnan(id(battery_voltage).state)) {
        return {};
      }
      return id(battery_voltage).state > 4.2f;
  - platform: gpio
    pin: GPIO34
    name: "Motion"
    id: motion
    device_class: motion
  - platform: gpio
    pin:
      number: GPIO25
      inverted: true
    name: "Rain"
    id: rain_detected
    device_class: moisture

switch:
  # WiFi master switch. Turning ON also blocks deep sleep so OTA/HA stay reachable.
  # Default ON — device boots reachable; flip OFF to enter battery mode.
  # We also stop/start the MQTT client in lockstep with WiFi so ESP-IDF's MQTT
  # subsystem doesn't spam ERROR logs trying to reconnect over a dead link.
  - platform: template
    name: "WiFi"
    id: wifi_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - wifi.enable:
      - deep_sleep.prevent: ds
      # Guard: during setup() the LwIP mutex doesn't exist yet and
      # enable() would assert-crash.  Only re-enable MQTT after on_boot
      # has set setup_done (i.e. when user flips the switch at runtime).
      - lambda: |-
          if (id(setup_done)) {
            id(mqtt_client).enable();
          }
      - logger.log: "WiFi ON → deep sleep prevented"
    turn_off_action:
      - lambda: 'id(mqtt_client).disable();'  # stop MQTT before WiFi drops
      - wifi.disable:
      - logger.log: "WiFi OFF"

  # Master deep-sleep override. When OFF, the device never sleeps regardless
  # of WiFi state — useful for staying online during diagnostics or OTA.
  # Default OFF — device stays awake until you explicitly enable sleep.
  - platform: template
    name: "Deep Sleep"
    id: deep_sleep_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - deep_sleep.allow: ds
      - logger.log: "Deep sleep allowed"
    turn_off_action:
      - deep_sleep.prevent: ds
      - logger.log: "Deep sleep prevented"

# How long the device sleeps between wakes.  Settable from HA's UI (the
# api:-backed entity below) AND via LoRaWAN downlink (handled by the
# component's downlink_numbers binding on channel 13).  An MQTT-discovered
# virtual number with the same role is auto-published by lorawan.publish_discovery.
number:
  - platform: template
    name: "Sleep duration (s)"
    id: sleep_duration_s
    min_value: 60
    max_value: 65535
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    unit_of_measurement: s
    mode: box
    set_action:
      - logger.log:
          format: "Sleep duration set to %.0f s"
          args: ['x']
      # Push the new value into the deep_sleep component for the next cycle.
      - lambda: |-
          id(ds).set_sleep_duration((uint32_t) x * 1000UL);

deep_sleep:
  id: ds
  # Awake budget per wake cycle.  Boot → on_boot's 10 s wait → lorawan.send →
  # sendReceive (~6 s) → buffer.  30 s comfortably covers all of that.
  run_duration: 30s
  # Default sleep duration; overridden at runtime by sleep_duration_s.set_action.
  sleep_duration: 60s

# Periodic uplinks while the device is awake (i.e. when deep sleep is OFF).
# When deep sleep is ON the device wakes, on_boot fires lorawan.send, sleeps —
# this interval rarely gets a chance to run in that mode, and that's fine.
interval:
  - interval: 60s
    then:
      - lorawan.send:

external_components:
  - source:
      type: local
      path: components

lorawan:
  nss_pin: 5
  dio1_pin: 26
  rst_pin: 14
  busy_pin: 27
  txen_pin: 32
  rxen_pin: 33
  join_eui: ${join_eui}
  dev_eui:  ${dev_eui}
  app_key:  ${app_key}
  port: 1

  # HA MQTT discovery — `lorawan.publish_discovery:` will emit retained
  # config messages for every entity below.  HA picks them up as a virtual
  # "LoRaWAN" device, always available regardless of the ESP's online state.
  mqtt_discovery:
    chirpstack_app_id: ${app_id}
    device_name: "LoRaWAN ${dev_eui}"

    # Buttons — fire-and-forget downlinks.  No state sync; the binary sensors
    # below show the actual device state read from the uplink echo.
    downlink_buttons:
      - name: "LoRaWAN mode"
        # WiFi off, deep-sleep on + current sleep duration — all in one downlink.
        when_pressed:
          - { channel: 11, value: false }  # ch11 = wifi_enabled → OFF
          - { channel: 12, value: true }   # ch12 = deep_sleep_enabled → ON
        include_number_channels: [13]      # bundle current sleep_duration_s
        fport: 11
        ha:
          icon: "mdi:access-point"
      - name: "WiFi Online mode"
        # WiFi on, deep-sleep off — device stays awake and reachable.
        when_pressed:
          - { channel: 11, value: true }   # ch11 = wifi_enabled → ON
          - { channel: 12, value: false }  # ch12 = deep_sleep_enabled → OFF
        fport: 11
        ha:
          icon: "mdi:wifi"

    # Binary sensors — read-only state display driven by the uplink echo.
    # ch11_digital_input and ch12_digital_input are echoed in every uplink
    # when report_state: true is set on the corresponding downlink_switch.
    diagnostic_binary_sensors:
      - name: "WiFi"
        value_template: "{{ 'ON' if value_json.object.ch11_digital_input == 1 else 'OFF' }}"
        device_class: connectivity
        icon: "mdi:wifi"
      - name: "Deep sleep"
        value_template: "{{ 'ON' if value_json.object.ch12_digital_input == 1 else 'OFF' }}"
        icon: "mdi:power-sleep"
      - name: "Charging"
        value_template: "{{ 'ON' if value_json.object.ch4_voltage | float > 4.2 else 'OFF' }}"
        device_class: battery_charging
      - name: "Motion"
        value_template: "{{ 'ON' if value_json.object.ch6_digital_input == 1 else 'OFF' }}"
        device_class: motion
      - name: "Rain"
        value_template: "{{ 'ON' if value_json.object.ch14_digital_input == 1 else 'OFF' }}"
        device_class: moisture

    # Diagnostic sensors pulled out of the uplink event JSON itself.
    # value_template is HA Jinja2 evaluated against `value_json` on each uplink.
    diagnostic_sensors:
      - name: "Last update"
        value_template: "{{ value_json.rxInfo[0].nsTime }}"
        device_class: timestamp
      - name: "LoRaWAN RSSI"
        value_template: "{{ value_json.rxInfo[0].rssi }}"
        unit_of_measurement: dBm
        device_class: signal_strength
        state_class: measurement
        icon: "mdi:access-point"

  cayenne_sensors:
    - sensor: device_uptime
      channel: 1
      type: u32             # custom: 4-byte unsigned, with scale below
      scale: 0.0166667      # seconds → minutes (1/60); u32 max → ~136 years
      ha:                   # override — unit becomes "min" after scaling
        name: "Uptime"
        unit_of_measurement: min
        device_class: duration
        state_class: total_increasing
    - sensor: wifi_rssi
      channel: 2
      type: analog_output   # signed, ÷100 — fits RSSI dBm
      # no ha: → inherits name/unit/device_class from the wifi_signal sensor
    - sensor: tcs34725_illuminance
      channel: 3
      type: illuminance
      # inherits from the tcs34725 sensor definition
    - sensor: battery_voltage
      channel: 4
      type: voltage
      # 100k/100k divider correction is applied in the ADC sensor above
    - sensor: battery_percentage
      channel: 5
      type: analog_input
      ha:
        name: "Battery"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
    - sensor: motion_state
      channel: 6
      type: digital_input
      ha:
        name: "Motion State"
        entity_category: diagnostic
    - sensor: aht20_temperature
      channel: 7
      type: temperature
    - sensor: aht20_humidity
      channel: 8
      type: humidity
    - sensor: bmp280_pressure
      channel: 9
      type: barometer
    - sensor: rain_state
      channel: 14
      type: digital_input
      ha:
        name: "Rain State"
        entity_category: diagnostic

  # downlink_switches: these channels are processed on the device but no HA
  # switch entity is published — buttons + binary sensors handle the HA side.
  downlink_switches:
    - switch: wifi_enabled
      channel: 11
      report_state: true    # echoed as ch11_digital_input in every uplink
      ha_discovery: false   # no HA switch entity — use buttons instead
    - switch: deep_sleep_enabled
      channel: 12
      report_state: true    # echoed as ch12_digital_input in every uplink
      ha_discovery: false

  downlink_numbers:
    - number: sleep_duration_s
      channel: 13
      type: u16             # [0x0D 0xF0 <hi> <lo>], 0..65535 seconds (~18 h)
      report_state: true    # echo current value back in uplink as ch13_u16
      ha_discovery: true   # settable via HA API; buttons bundle it in downlinks
